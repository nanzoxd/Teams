name: Teams
version: ${project.version}
author: booksaw
description: A plugin to create teams with other players
main: teams.Main
folia-supported: true
api-version: 1.21

softdepend:
  - PlaceholderAPI
  - HolographicDisplays
  - Vault
  - WorldGuard
  - UltimateClaims
  - DecentHolograms
  - TAB
  - CelestCombat-Pro

permissions:
  teams.standard:
    description: This permission gives the user access to the teams system (joining, leaving teams etc.)
    default: true
  teams.admin:
    description: This permission gives the user access to the admin system for Teams
    default: op
  teams.join:
    default: true
    description: Allows access to /team join
  teams.echest:
    default: true
    description: Allows access to /team echest
  teams.ban:
    default: true
    description: Allows access to /team ban
  teams.chat:
    default: true
    description: Allows access to /team chat
  teams.create:
    default: true
    description: Allows access to /team create
  teams.promote:
    default: true
    description: Allows access to /team promote
  teams.description:
    default: true
    description: Allows access to /team description
  teams.disband:
    default: true
    description: Allows access to /team disband
  teams.home:
    default: true
    description: Allows access to /team home
  teams.anchor:
    default: true
    description: Allows access to /team anchor
  teams.anchor.use:
    default: true
    description: Allows the user to actually be affected by home anchor (if requirements are met) on respawn
  teams.setanchor:
    default: true
    description: Allows access to /team setanchor
  teams.setanchor.notify:
    default: true
    description: Allows the user to be notified about team anchor state change
  teams.invite:
    default: true
    description: Allows access to /team invite
  teams.kick:
    default: true
    description: Allows access to /team kick
  teams.info:
    default: true
    description: Allows access to /team info
  teams.leave:
    default: true
    description: Allows access to /team leave
  teams.name:
    default: true
    description: Allows access to /team name
  teams.open:
    default: true
    description: Allows access to /team open
  teams.teamName:
    default: true
    description: Users with this permission will have their team name dispalyed above their head
  teams.gui:
    default: true
    description: Allows access to the team menu that opens with /team
  teams.title:
    default: true
    description: Allows access to /team title
  teams.title.color.color:
    default: op
    description: Allows the user to add color codes into their titles
  teams.title.color.format:
    default: op
    description: Allows the user to add format codes into their titles
  teams.title.self:
    default: op
    description: Allows the user to change their own title even if they are not the team owner
  teams.unban:
    default: true
    description: Allows access to /team unban
  teams.sethome:
    default: true
    description: Allows access to /team sethome
  teams.delhome:
    default: true
    description: Allows access to /team delhome
  teams.demote:
    default: true
    description: Allows access to /team demote
  teams.top:
    default: true
    description: Allows access to /team top
  teams.rank:
    default: true
    description: Allows access to /team rank
  teams.rankup:
    default: true
    description: Allows access to /team rankup
  teams.tag:
    default: true
    description: Allows access to /team tag
  teams.pvp:
    default: true
    description: Allows access to /team pvp
  teams.admin.version:
    default: op
    description: Allows access to /teama version
  teams.admin.home:
    default: op
    description: Allows access to /teama home
  teams.admin.anchor:
