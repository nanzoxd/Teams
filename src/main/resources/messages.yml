help.unban: Unbans the specified player from your team
help.kick: Kick that player from your team
help.leave: Leave your current team
help.chat: Send a message only to your team
help.name: View and change your team's name
help.sethome: Sets your team's home
help.create: Create a team with the specified name
help.invite: Invite the specified player to your team
help.disband: Disband your current team
help.open: Toggle if the team is invite only
help.info: View information about the specified player / team
help.color: Change your teams color
help.title: Change that players title within the team
help.top: View the top teams
help.rank: View the rank of a team
help.join: Join the specified team
help.delhome: Delete your team's home
help.ally: Used to request an alliance with another team
help.neutral: Remove allies and reject ally requests
help.allychat: Send a message only to your allies
help.anchor: Toggles whether you want to respawn at your team's home
help.setanchor: Sets your team home's ability to serve as a respawn point
