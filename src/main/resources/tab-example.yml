# Teams + TAB (v6 or newer)
# Nothing to do: when TAB is installed Teams turns this on for you the first time it starts
# (tab.autoSetup in config.yml), makes a backup called config.yml.teams-backup and runs /tab reload.
#
#   Without TAB:  [Niga] mrnanzo      (display.tab.enabled in config.yml)
#   With TAB:     mrnanzo
#                 [Niga]              (the tag, in the team colour, on the line under the name)
#
# What Teams writes in plugins/TAB/config.yml, in case you want to do it yourself
# (set tab.autoSetup to false in the Teams config.yml first):
#
# belowname-objective:
#   enabled: true
#   value: "0"
#   fancy-value: "%teams-below%"
#   title: " "
#   fancy-value-default: ""
#
# Notes
# - The line under the name is the vanilla "below name" score, shown as text. Minecraft 1.20.3 and newer shows the
#   tag; older clients show a 0 instead.
# - Staff (OPs and teams.admin) get their name colour and the top of the tab list through TAB as well.
# - %teams-below% is made by Teams for TAB. With PlaceholderAPI you can also use %teams_belowname%.
#
# Under the name: "[Niga] ⬝ 100ms" (brackets white, tag in the team colour, symbol and number white with a
# gray shadow, "ms" blue with a dark blue shadow). Nothing in the tab list, only under the name.
# belowname-objective:
#   enabled: true
#   value: "0"
#   fancy-value: "<white>[</white>%teams-tagc%<white>]</white> <shadow:#808080><white>⬝</white></shadow> <shadow:#808080><white>%ping%</white></shadow><shadow:#2E2EFF><#87CEEB>ms</#87CEEB></shadow>"
#   fancy-value-default: ""
#   title: " "
#   view-distance: 10
# Shows as text on Minecraft 1.20.3 and newer (older clients show the number).
#
# Placeholders made by Teams for TAB (all empty without a team)
#   %teams-below%    [Niga] in the team colour (legacy colour codes, do not mix it with <tags>)
#   %teams-tag%      [Niga] no colour, use your own colour around it
#   %teams-tagraw%   Niga   no brackets, no colour: build your own format, for example
#                    "<white>[</white><#00C3FF>%teams-tagraw%</#00C3FF><white>]</white>"
#   %teams-tagc%     Niga   no brackets, in the team colour
