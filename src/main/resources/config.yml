# ╔══════════════════════════════════════════════════════════════════╗
# ║                     Teams  config                          ║
# ╚══════════════════════════════════════════════════════════════════╝
# The MAIN FEATURES are in the first 4 sections. Everything else is below them.
# After changing something, restart the server (or use /teama reload).
# Colours are hex, written like &#FFDC73


# ════════════════════════════════════════════════
#  1. DISPLAY      team in chat and in the tab list
# ════════════════════════════════════════════════
display:
  chat:
    enabled: true        # show the team in front of chat messages      [true / false]
    show: tag            # what to show                                 [name / tag]
  tab:
    enabled: false       # team tag in front of the name: [Niga] mrnanzo   [true / false]
                         # (only when the TAB plugin is NOT installed, see 'tab' below)
    show: tag            # what to show                                 [name / tag]
    position: prefix     # in front of or behind the player name        [prefix / suffix]
  # Team name / tag shown with the player name (above the head, in front or under it) in small capitals: ɴɪɢᴀ
  smallCaps: true
  # Team owners get this in front of their tag, in chat and with the name: [👑ɴɪɢᴀ]. Empty = off.
  ownerCrown: '👑'
  # Colour of the crown. The team name keeps the team colour. Only one player per team gets it (the creator, or the owner it was handed to).
  crownColor: '#FFFF5C'
  # Colour the team name with the team colour wherever it is shown.     [true / false]
  colorTeamName: true

# The line UNDER the player name, made by Teams itself (no TAB plugin needed):
#            mrnanzo
#            [Niga]  or  [NoTeam]
# While it is on, the name above the head stays alone and the tag is on this line.
belowname:
  builtin: true        # true = Teams makes the line. false = use the TAB plugin (tab.hook) or the tag in front of the name
  showNoTeam: true     # players without a team show the noTeam text
  noTeam: '<white>[</white><gray>NoTeam</gray><white>]</white>'
  format: '<white>[</white>{tag}<white>]</white>'     # {tag} is the team tag in the team colour
  separator: ' <gray>⬝</gray> '
  # Extras after the tag, all off by default (MiniMessage)
  # Text shadow colours (<shadow:...>) need Minecraft 1.21.4 or newer.
  shadowColor: '#FF2954'       # shadow of the hearts text, a hex colour like #RRGGBB
  pingShadowColor: '#555555'   # shadow of the ping text, a hex colour like #RRGGBB
  ping: false
  pingFormat: '<shadow:{pingShadowColor}><white>{ping}</white><#87CEEB>ms</#87CEEB></shadow>'   # [Niga] ⬝ 45ms
  hearts: false
  heartsFormat: '<shadow:{shadowColor}><white>{hearts}</white> <#FF2954>♥</#FF2954></shadow>'   # [Niga] ⬝ 10 ♥  or 9.5 ♥

# Teams Tab: header and footer of the player list, with a Teammates view. Players switch by sneaking or with /team tab.
# Works with the normal tab list and with the TAB plugin (the header and footer are then set through TAB).
# In the Teammates view players outside your team are taken off your list (they stay visible in the world).
# Turn it on in /teamconfig (Design).
# Text is MiniMessage. {view} {teamLine} {members} {online} {switch} are filled in.
tablist:
  enabled: false
  useTab: true              # set the header and footer through the TAB plugin when it is installed
  mode: both                # both = players switch between Everyone and Teammates, everyone = only Everyone, team = only Teammates
  sneakSwitch: true         # sneak to switch (every player can turn it off in /team settings)
  defaultView: everyone     # the view players start in: everyone or team
  onlineColor: '#80ED26'
  offlineColor: '#FF1717'
  maxMembers: 12            # teammates listed in the header
  viewTeam: 'Teammates'
  viewEveryone: 'Everyone'
  switchSneak: 'Sneak To Switch'
  switchCommand: '/team tab'
  teamLine: '<#F1D58F>⛨ <#FFF0CC>Team <white>[</white>{tag}<white>]</white>'
  noTeamLine: '<#F1D58F>⛨ <#F7E2AD>No team yet'
  # The teammates themselves are the real entries of the player list (head and ping), like any other player.
  # To also list every teammate by name in the header (online green, offline red), add a line with only {members} to teamHeader.
  # Every line below can be changed. Per view: teamHeader/teamFooter (Teammates view) and everyoneHeader/everyoneFooter (Everyone view).
  # Placeholders: {view} {teamLine} {online} {switch}. A line with only {members} lists every teammate (online green, offline red).
  # Lines with {switch} are left out when mode is not "both".
  teamHeader:
    - ''
    - '<#FFF0CC>{view}'
    - '{teamLine}'
    - ''
  everyoneHeader:
    - ''
    - '<#FFF0CC>{view}'
    - '{teamLine}'
    - ''
    - '<#F7E2AD>Online: <#FFF0CC>{online} players'
    - ''
  everyoneFooter:
    - ''
    - '<#F1D58F>⇄ <#FFF0CC>Teams Tab <#F7E2AD>[{switch}]'
  teamFooter:
    - ''
    - '<#F1D58F>⇄ <#FFF0CC>Teams Tab <#F7E2AD>[{switch}]'
    - '<gray>ᴛᴇᴀᴍ ᴘʟᴜɢɪɴ ʙʏ @</gray><gradient:#48E4FF:#D4F7FF:#D4F7FF>ᴍʀɴᴀɴᴢᴏ</gradient>'
    - ''

# Team locator bar (Minecraft 1.21.6+). EXPERIMENTAL, might not work properly with other plugins that change the locator bar.
# On: players without a team are hidden from the bar, and every player can hide themselves in /team settings.
# It uses a temporary attribute modifier, so the values other plugins set are left alone. The vanilla bar works by distance, so it
# cannot show teammates only. Turn it on in /teamconfig (Design).
locator:
  enabled: false

# Team commands (set home, set warp, ...) are only listed in tab completion and help for players who can use them:
# they have the permission, are in a team and have the rank from teampermissions.yml
commands:
  hideUnavailable: true

# TAB plugin (only when belowname.builtin is false): when it is installed this is done automatically and the tag is shown UNDER the name instead:
#            mrnanzo
#            [Niga]
tab:
  hook: true         # use the TAB plugin when it is installed                    [true / false]
  autoSetup: true    # turn on belowname-objective in plugins/TAB/config.yml once (a backup is made)

# Staff (OPs and everyone with the permission below) are at the TOP of the tab list, with or without a team,
# and their name has this colour. Works even when display.tab.enabled is false.
staff:
  enabled: true
  color: '#D11F3F'          # shown in the tab list and chat only, not above the head
  chat: true                # staff names are coloured in chat
  permission: teams.admin


# ════════════════════════════════════════════════
#  2. TEAMS        how many, how big
# ════════════════════════════════════════════════
teams:
  maxTeams: -1           # how many teams can exist on the server       [-1 = no limit]
  maxMembers: 10         # members in one team (level 1)
  maxAdmins: 5           # admins in one team   [-1 = no limit]
  maxOwners: 2           # owners in one team
  maxWarps: 2            # warps per team
  maxChests: 2           # claimed chests per team

  nameMin: 2             # shortest team name
  nameMax: 5             # longest team name
  tagMax: 4              # longest tag
  titleMax: 10           # longest player title

  singleOwner: false     # only one owner per team                      [true / false]
  enforceTag: false      # a tag is needed to make a team               [true / false]
  allowPassword: true    # teams can use passwords on warps             [true / false]
  inviteSeconds: 120     # how long an invite lasts
  # Shown in /team rank for level 1
  rankLore:
    - '&#FFF1E0The first level'


# ════════════════════════════════════════════════
#  3. ALLIES       allies on / off, how many
# ════════════════════════════════════════════════
allies:
  enabled: true          # false = /team ally is turned off             [true / false]
  limit: 5               # how many allies a team can have
  chests: true           # allies can open each other's chests          [true / false]
  # Where the message goes when teams become allies or neutral.  [CHAT / TITLE / ACTIONBAR]
  messageChannel:
    - CHAT
    - TITLE


# ════════════════════════════════════════════════
#  4. MENU         /team opens the menu, /team top opens team top
# ════════════════════════════════════════════════
features:                  # turn a whole group of /team commands on or off (needs a reload)
  allies: true             # ally, neutral, allychat
  warps: true              # warp, warps, setwarp, delwarp
  homes: true              # home, sethome, delhome
  chests: true             # chest, echest
gui:
  enabled: true          # false = /team shows the help list instead    [true / false]
  admin: true            # false = /teamadmin shows the help list     [true / false]
  dialogs: true          # /team top and /teamconfig use dialogs (Paper 1.21.6+)  [true / false]
  topSize: 10            # teams in team top (1-36)
                         # team top ranks by score, kills, deaths, K/D and playtime


# ──────────────────────────────────────────────
#  Everything below is optional
# ──────────────────────────────────────────────

# ════════════════════════════════════════════════
#  5. CHAT
# ════════════════════════════════════════════════
chat:
  allowToggle: true      # players can switch to team/ally chat        [true / false]
  logTeamChat: true      # write team chat in the console              [true / false]
  # Start a message with this to send it to another chat
  prefixes:
    globalToTeam: '!'          # global chat -> team chat
    globalToAlly: '?'          # global chat -> ally chat
    teamOrAllyToGlobal: '!'    # team / ally chat -> global chat
  notifyTeamPresence: true   # tell teammates when a member logs in / out [true / false]


# ════════════════════════════════════════════════
#  5b. SOUNDS      played when you get a team message
#      Team chat (mrnanzo » hello) never plays a sound.
# ════════════════════════════════════════════════
# sound = a Minecraft sound name (https://minecraft.wiki/w/Sounds.json), use 'none' to turn one off
sounds:
  enabled: true
  create:                        # a team was created
    sound: 'entity.player.levelup'
    volume: 1.0
    pitch: 1.0
  join:                          # someone joined a team
    sound: 'entity.experience_orb.pickup'
    volume: 1.0
    pitch: 1.0
  leave:                         # someone left a team
    sound: 'entity.villager.no'
    volume: 1.0
    pitch: 1.0
  disband:                       # a team was disbanded
    sound: 'block.anvil.destroy'
    volume: 1.0
    pitch: 1.0
  invite:                        # you were invited to a team
    sound: 'block.note_block.pling'
    volume: 1.0
    pitch: 1.5
  ally:                          # your team got an ally request
    sound: 'block.note_block.pling'
    volume: 1.0
    pitch: 1.0
  echest:                        # /team echest was opened
    sound: 'block.ender_chest.open'
    volume: 1.0
    pitch: 1.0
  teleport:                      # after /team home or /team warp
    sound: 'entity.enderman.teleport'
    volume: 0.7
    pitch: 1.2
  promote:                       # you were promoted
    sound: 'entity.player.levelup'
    volume: 0.8
    pitch: 1.4
  demote:                        # you were demoted
    sound: 'block.note_block.bass'
    volume: 1.0
    pitch: 0.7
  pull:                          # a teammate used /teampull
    sound: 'block.note_block.chime'
    volume: 1.0
    pitch: 1.5
  chatOn:                        # /team chat or /team allychat turned ON (messages themselves are silent)
    sound: 'block.note_block.pling'
    volume: 1.0
    pitch: 1.8
  chatOff:                       # /team chat or /team allychat turned OFF
    sound: 'block.note_block.pling'
    volume: 1.0
    pitch: 0.8


# ════════════════════════════════════════════════
#  6. COMBAT
# ════════════════════════════════════════════════
pull:
  cooldown: 5          # seconds between two /teampull from the same player
  combatSeconds: 15     # a fight counts as "combat with" for this long after the last hit
combat:
  disableCombat: true        # members cannot hurt each other          [true / false]
  noTagTeammates: true       # CelestCombat-Pro: teammates can not combat tag each other  [true / false]
  disablePotions: true       # members cannot splash each other        [true / false]
  playerDamageSelf: true     # players can still hurt themselves       [true / false]


# ════════════════════════════════════════════════
#  7. SCORE and RESETS
# ════════════════════════════════════════════════
events:
  kill:
    score: 1             # score for a kill
    spam: 0              # score if it is a repeat kill (-1 = lose score, 0 = nothing)
  death:
    score: 0
    spam: -1
minScore: 0              # score can not go below this
spamThreshold: 60        # seconds in which a repeat counts as spam

enableAutoPurge: false   # reset scores on a schedule                   [true / false]
autoPurge:
  - '1:6'                # day:hour  -> 1st of the month at 6am
purgeCommands:           # commands that run when scores reset
  - 'give @a minecraft:dirt 1'

maxHologramLines: 10


# ════════════════════════════════════════════════
#  8. HOME and TELEPORT
# ════════════════════════════════════════════════
noTeleport: false        # turn off /team home and /team warp           [true / false]
tpDelay: 0               # seconds to wait before teleporting
noMove: false            # cancel the teleport if the player moves      [true / false]
maxMove: 0               # blocks the player may move
anchor:
  enable: true
  checkAnchoredPlayer: true         # respawn at team home
  checkUsePermission: true          # needs teams.anchor.use
  ignoreObsidianAnchorRespawn: false
  ignoreBedRespawn: false
  priority: HIGH


# ════════════════════════════════════════════════
#  9. LEVELS       extra levels, bought with score (/team rankup)
# ════════════════════════════════════════════════
# Level 1 is the teams: section above. Add l2, l3 ... to give teams more room.
levels:
  l2:
    price: 100           # score needed
    maxMembers: 20       # members in one team
    maxChests: 2
    maxWarps: 2
    maxAdmins: 5
    maxOwners: 1
    rankLore:
      - '&#FFF1E0The second level'
    # startCommands:     # run when a team reaches this level
    # endCommands:       # run when a team leaves this level

permissionLevels: false  # use permissions like teams.limit.15     [true / false]

# Commands run when a player changes rank (%player% %team% %level%)
promoteCommands:
  ADMIN:
  OWNER:
demoteCommands:
  STANDARD:
  ADMIN:
titleRemoval: true       # show a title when a player is kicked or banned


# ════════════════════════════════════════════════
#  10. LOOK         colours and text
# ════════════════════════════════════════════════
theme:
  version: 2
  primary: '#F1D58F'         # prefix, usage messages, menu navigation
  secondary: '#FFF0CC'       # important highlights
  highlight: '#FFDC73'       # command names, labels, success
  text: '#FFF1E0'            # normal text
  accent: '#FFD7CA'          # hints, secondary info, errors
  on: '#7CFF7C'              # tick in settings that are on
  off: '#FF6B6B'             # cross in settings that are off
  helpCommand: '#FFDC73'
  helpDescription: '#FFF1E0'
# Colours of the dialogs (/team top, team profile, /teamconfig). Reload to apply.
dialog:
  text: '#FFF0CC'        # primary text
  secondary: '#F7E2AD'   # labels and hints
  gold: '#F1D58F'        # highlights
  on: '#80ED26'          # enabled and successful (tick)
  off: '#FF1717'         # disabled, back, next, close (cross)
  info: '#5490FF'        # information
  info2: '#91B8FF'       # secondary blue (admins)
  special: '#FADE55'     # special highlights (top 3, owners)
prefixFormat: '&#F1D58F[Teams] &#FFF1E0'   # in front of plugin messages (MiniMessage like <#F1D58F> also works)
language: en

# New teams get a RANDOM colour. Owners change it with /team color <name>.
# Colours nobody can pick, e.g. [black, white]. Names: green blue red pink purple yellow orange
# cyan rose brown white black gray navy mint lavender gold peach sky lime
colors:
  banned: [ ]

allowedChars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'
bannedChars: ",.!\"\u00A3$%^&*()[]{};:#~\\|`\u00AC"
blacklist:                   # team names nobody can use
  - 'teamsisbad'


# ════════════════════════════════════════════════
#  11. ADVANCED
# ════════════════════════════════════════════════
# Vanilla (scoreboard) teams. All off = Teams makes none, which keeps it from fighting with TAB.
teamOptions:
  collide: true
  privateDeath: false
  privateName: false
  canSeeFriendlyInvisibles: false

command:
  team: [ ]                  # extra names for /team
  teama:                     # names for /teamadmin
    - teama
fullyCustomHelpMessages: false

storageType: YAML            # YAML, SQL or SEPARATED_YAML
database:                    # only used for SQL
  host: localhost
  port: 3306
  database: spigot
  user: root
  password: password
  additionalOptions:
    - 'useSSL=false'
  tablePrefix: Teams_

useVault: true               # command costs in team.yml need Vault
worldGuard:
  enabled: true
ultimateClaims:
  enabled: true
apollo:
  teamview:
    enabled: false
extension:
  enableTick: 1
rebuildLookups: false
invalidateCacheSeconds: 60
