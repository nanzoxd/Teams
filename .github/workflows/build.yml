name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: |
          set +e
          mvn -B -ntp package 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E "ERROR|error:" build.log | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: Teams
          path: target/Teams-*.jar
